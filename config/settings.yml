# Settings for the CloudRail-Cap plugin.
#
# Everything lives under the top-level `plugins:` key so it appears in the
# "Plugins" section of /admin/site_settings. Setting names are all prefixed
# with `cap_verification_` so the "Settings" button on the plugin's
# /admin/plugins entry filters to exactly this plugin.
#
# `client: true` means the value is also shipped to the Ember client. Only the
# instance URL, site key and theme are needed in the browser - the secret key
# deliberately stays server-side and must NOT be marked client.

plugins:
  cap_verification_enabled:
    default: false
    client: true

  cap_verification_instance_url:
    default: ""
    client: true
    regex: "^$|^https?://[^\\s]+$|^[a-zA-Z0-9.-]+(:\\d+)?(/.*)?$"

  cap_verification_site_key:
    default: ""
    client: true

  cap_verification_secret_key:
    default: ""
    secret: true
    client: false

  # Pinned on purpose. `@latest` is a listed production failure mode in Cap's
  # own guide ("version unpinned in production, so an upstream release can
  # change behavior without warning"), and the un-scoped `cap-widget` name is a
  # legacy alias for `@cap.js/widget`. The widget is a plain ES module with no
  # dependencies, so pinning costs nothing.
  #
  # jsDelivr is blocked in some jurisdictions, including parts of mainland
  # China. If the forum must be reachable there, self-host this file and point
  # the setting at it — or enable Cap's own asset server and use
  # https://<instance>/assets/widget.js.
  cap_verification_widget_script_url:
    default: "https://cdn.jsdelivr.net/npm/@cap.js/widget@0.1.58"
    client: true

  # Cap's widget has no light/dark/auto switch — it is themed purely through CSS
  # custom properties (`--cap-background`, `--cap-color`, ...). There is no
  # `data-cap-theme` attribute; passing one is silently ignored. The plugin
  # instead sets those variables itself in cap-verification.scss, driven by
  # this setting.
  #
  # The widget's own fallback colours are hard-coded light (#fdfdfd background,
  # #212121 text) and it does not implement prefers-color-scheme, so leaving
  # the variables unset puts a bright white box in a dark forum. Every mode
  # therefore sets them:
  #
  #   auto  -> uses Discourse's own variables, so the widget follows whatever
  #            colour scheme the reader has selected
  #   light -> pinned light, even on a dark forum
  #   dark  -> pinned dark, even on a light forum
  cap_verification_widget_theme:
    default: "auto"
    type: enum
    choices:
      - "light"
      - "dark"
      - "auto"
    client: true

  cap_verification_protect_signup:
    default: true
    client: false

  cap_verification_protect_login:
    default: true
    client: false

  cap_verification_skip_for_staff:
    default: true
    client: false

  cap_verification_min_trust_level:
    default: 0
    min: 0
    max: 4
    client: false

  cap_verification_max_attempts:
    default: 10
    min: 1
    max: 200
    client: false

  cap_verification_timeout_seconds:
    default: 8
    min: 1
    max: 60
    client: false
