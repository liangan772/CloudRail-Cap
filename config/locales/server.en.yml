en:
  site_settings:
    cap_verification_enabled: "Enable Cap human verification. Blocks bot signups and logins with a self-hosted proof-of-work CAPTCHA."
    cap_verification_instance_url: "URL of your Cap instance, e.g. https://cap.example.com (must be reachable by visitors)."
    cap_verification_site_key: "Cap site key from your Cap console (not the admin key)."
    cap_verification_secret_key: "Cap secret key from your Cap console. Kept server-side; never sent to the browser."
    cap_verification_widget_theme: "Colour scheme of the Cap checkbox widget."
    cap_verification_widget_script_url: "URL of the cap-widget script. Defaults to the jsDelivr CDN; point this at a self-hosted copy for maximum privacy."
    cap_verification_protect_signup: "Require Cap verification on the signup form."
    cap_verification_protect_login: "Require Cap verification on the login form."
    cap_verification_skip_for_staff: "Never challenge staff accounts."
    cap_verification_min_trust_level: "Skip verification for logged-in users at or above this trust level (0 = challenge everyone)."
    cap_verification_max_attempts: "Maximum failed verifications per IP per minute before the IP is throttled."
    cap_verification_timeout_seconds: "Timeout when calling the Cap server to verify a token."

  cap_verification:
    errors:
      missing_token: "Human verification is required. Please tick the verification box and try again."
      invalid_token: "Human verification failed or expired. Please tick the box again."
