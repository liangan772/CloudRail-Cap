        1. 运行 Cap standalone 服务并打开它的控制台。
        2. 创建一个站点密钥，复制站点密钥与私钥。
        3. 粘贴实例地址与两个密钥，然后启用插件。
        4. 可选：自托管 <code>cap-widget</code> 并填写组件脚本地址，
           这样就不会请求任何第三方 CDN。
